<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Hourbridge schickt nichts nach draußen: keine Verbindungen, keine fremden Skripte, Schriften
     oder Bilder. Alles Rechnen passiert im Browser mit der eingebauten Zeitzonen-Datenbank. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; manifest-src 'self'; worker-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="dark light">
<meta name="theme-color" content="#0E171F">
<meta name="description" content="UTC in deutsche Zeit umrechnen und umgekehrt, mit beliebig vielen Orten, Zeitleiste, Zeitumstellungen und Kalender-Export. Ohne Cookies, ohne Werbung, ohne Tracking, offline nutzbar. / Convert UTC to Berlin time and back. No cookies, no ads, no tracking, works offline.">
<meta name="application-name" content="Hourbridge">
<meta name="apple-mobile-web-app-title" content="Hourbridge">
<!-- Link-Vorschau. og:image muss absolut sein, Crawler lösen relative Pfade nicht auf. -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://dennismit2n.github.io/hourbridge/">
<meta property="og:title" content="Hourbridge · UTC ↔ Berlin">
<meta property="og:description" content="Convert UTC to German time and back, with any number of places, one timeline and daylight saving done right. No ads, no cookies, works offline after the first visit.">
<meta property="og:image" content="https://dennismit2n.github.io/hourbridge/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Dark graphic: the Hourbridge clock icon and name, the line “14:00 UTC is 15:00 CET in Berlin”, below in German „UTC und deutsche Zeit, Zeitumstellungen inklusive.“ and „Free, no cookies, no ads, offline after the first visit“, at the bottom a 24-hour band from night to working hours.">
<meta property="og:locale" content="en_GB">
<meta property="og:locale:alternate" content="de_DE">
<meta name="twitter:card" content="summary_large_image">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="icon" href="./icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Hourbridge · UTC ↔ Berlin</title>
<script>
/* Vor dem ersten Bild: gemeinsame Darstellung der Werkstatt setzen (werkstatt.darstellung),
   sonst blitzt kurz die falsche Farbe auf. Grundzustand ohne Wahl ist dunkel. */
(function () {
  var d = document.documentElement;
  try {
    var th = localStorage.getItem('werkstatt.darstellung');
    var mm = window.matchMedia, ts = null, vs = null;
    if (th === 'light' || th === 'dark') ts = th;
    else if (th === 'hc-dark' || th === 'hc-light') { ts = th.slice(3); vs = 'contrast'; }
    else if (th === 'cvd-dark' || th === 'cvd-light') { ts = th.slice(4); vs = 'cvd'; }
    else if (th === 'invert') vs = 'invert';
    else if (th && /dark/.test(th)) ts = 'dark';
    else if (th && /light/.test(th)) ts = 'light';
    else if (mm && mm('(prefers-contrast: more)').matches) { ts = mm('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; vs = 'contrast'; }
    if (ts) d.setAttribute('data-theme', ts);
    if (vs) d.setAttribute('data-vision', vs);
  } catch (e) {}
  /* beforeinstallprompt kann kommen, bevor das Skript am Seitenende läuft: hier aufheben. */
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault();
    window.zuInstall = e;
    if (window.zuInstallZeigen) window.zuInstallZeigen();
  });
})();
</script>
<style>
/* Dunkel ist der Grundzustand. Hell nur über die Systemeinstellung (bei „System“) oder die Wahl „Hell“. */
:root {
  color-scheme: dark;
  --bg: #0E171F; --panel: #131E28; --panel-2: #182633; --line: #2B3B4D; --line-2: #3A4E64;
  --text: #B7B1D7; --head: #D8D1E2; --soft: #8C88AC;
  --mauve: #B699C1; --mauve-bg: #2A2036; --green: #7EB39D; --green-bg: #15302A; --blue: #8CA7CE; --blue-bg: #17263A;
  --warn: #D9B76E; --warn-bg: #30270F; --bad: #E39A9A;
  --night: #0F1A2B; --night-t: #6F7FA0; --dawn: #262A47; --dawn-t: #A49FCB;
  --day: #29405A; --day-t: #C9D6EA; --work: #2C5045; --work-t: #CBE7DA; --work-mark: #7EB39D;
  --cursor: #E2C6EC; --focus: #B699C1;
  --r: 14px;
}
/* Umkehr dreht die Farben um; der gedämpfte Text braucht dafür einen helleren Ausgangston,
   sonst liegt er umgedreht unter 4,5:1. Der Hell-Block darunter gewinnt bei hellem System. */
:root[data-vision="invert"] { --soft: #ABACD1; }
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    color-scheme: light;
    --bg: #F1F0F6; --panel: #FFFFFF; --panel-2: #F6F5FA; --line: #D8D5E5; --line-2: #BDB8D2;
    --text: #2E2B45; --head: #17152B; --soft: #5F5B7D;
    --mauve: #6E4580; --mauve-bg: #F2EAF5; --green: #276149; --green-bg: #E3F2EB; --blue: #2F5287; --blue-bg: #E6EDF8;
    --warn: #7A5600; --warn-bg: #FBF1D9; --bad: #9B2C2C;
    --night: #2F3A57; --night-t: #D3DAEC; --dawn: #8B87B6; --dawn-t: #FFFFFF;
    --day: #DCE6F2; --day-t: #24324A; --work: #CBE6D8; --work-t: #17402F; --work-mark: #276149;
    --cursor: #6E4580; --focus: #6E4580;
  }
}
:root[data-theme="light"] {
  color-scheme: light;
  --bg: #F1F0F6; --panel: #FFFFFF; --panel-2: #F6F5FA; --line: #D8D5E5; --line-2: #BDB8D2;
  --text: #2E2B45; --head: #17152B; --soft: #5F5B7D;
  --mauve: #6E4580; --mauve-bg: #F2EAF5; --green: #276149; --green-bg: #E3F2EB; --blue: #2F5287; --blue-bg: #E6EDF8;
  --warn: #7A5600; --warn-bg: #FBF1D9; --bad: #9B2C2C;
  --night: #2F3A57; --night-t: #D3DAEC; --dawn: #8B87B6; --dawn-t: #FFFFFF;
  --day: #DCE6F2; --day-t: #24324A; --work: #CBE6D8; --work-t: #17402F; --work-mark: #276149;
  --cursor: #6E4580; --focus: #6E4580;
}
/* Sehhilfen der Werkstatt */
:root[data-vision="contrast"]:not([data-theme="light"]) {
  --bg: #000; --panel: #000; --panel-2: #0A0A0A; --line: #A0A0A0; --line-2: #C4C4C4;
  --text: #E0E0E0; --head: #FFFFFF; --soft: #C4C4C4; --mauve: #E6C8F0; --green: #9CE0C0; --blue: #B5CCF2; --warn: #F2D27A;
  --night: #000; --night-t: #C4C4C4; --dawn: #1E1E1E; --dawn-t: #E0E0E0; --day: #3A3A3A; --day-t: #FFFFFF;
  --work: #0D3B2C; --work-t: #FFFFFF; --work-mark: #9CE0C0; --cursor: #FFFFFF; --focus: #FFFFFF;
}
:root[data-vision="contrast"][data-theme="light"] {
  --bg: #FFF; --panel: #FFF; --panel-2: #FFF; --line: #585757; --line-2: #2B2B2B;
  --text: #000; --head: #000; --soft: #2B2B2B; --mauve: #4A1D5C; --green: #0B4A30; --blue: #133C78; --warn: #5A3E00;
  --night: #000; --night-t: #FFF; --dawn: #444; --dawn-t: #FFF; --day: #FFF; --day-t: #000;
  --work: #DDF2E6; --work-t: #000; --work-mark: #0B4A30; --cursor: #000; --focus: #000;
}
:root[data-vision="contrast"] :is(.karte, .feld, .knopf, select, input) { border-width: 2px; }
:root[data-vision="contrast"] :is(button, input, select, a, [tabindex]):focus-visible { outline-width: 3px; }
:root[data-vision="cvd"]:not([data-theme="light"]) { --green: #56B4E9; --work-mark: #56B4E9; --work: #12324A; --warn: #F0E442; --bad: #E8743A; --mauve: #CC9EC2; }
:root[data-vision="cvd"][data-theme="light"] { --green: #0067A2; --work-mark: #0067A2; --work: #D6E8F5; --warn: #956500; --bad: #974100; }
:root[data-vision="invert"] { filter: invert(1); }
@media print { :root[data-vision="invert"] { filter: none; } }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  font-variant-numeric: tabular-nums;
  min-height: 100vh;
}
a { color: var(--blue); }
button, input, select { font: inherit; color: inherit; }
:is(button, input, select, a, [tabindex]):focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.huelle { max-width: 1100px; margin: 0 auto; padding: 0 16px 48px; }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Kopf */
header.kopf { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 18px 0 8px; }
.marke { display: flex; align-items: center; gap: 10px; margin-right: auto; text-decoration: none; color: var(--head); }
.marke svg { width: 34px; height: 34px; flex: none; }
.marke b { font-size: 20px; letter-spacing: .01em; }
.steuer { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
select, .knopf {
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; min-height: 40px;
}
select { padding-right: 28px; appearance: none;
  background-image: linear-gradient(45deg, transparent 50%, var(--soft) 50%), linear-gradient(135deg, var(--soft) 50%, transparent 50%);
  background-position: calc(100% - 15px) 52%, calc(100% - 10px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
.knopf { cursor: pointer; display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; }
.knopf:hover { border-color: var(--line-2); background: var(--panel-2); }
.knopf.akzent { border-color: var(--mauve); color: var(--mauve); background: var(--mauve-bg); }
.knopf[aria-pressed="true"] { border-color: var(--mauve); color: var(--head); background: var(--mauve-bg); }
.knopf svg { width: 17px; height: 17px; flex: none; }

/* Antwortzeile */
.antwort { padding: 14px 0 6px; }
.antwort h1 { margin: 0; font-size: clamp(15px, 2.2vw, 17px); font-weight: 600; color: var(--soft); letter-spacing: .02em; }
.satz { margin: 4px 0 0; font-size: clamp(24px, 4.6vw, 40px); line-height: 1.2; color: var(--head); font-weight: 300; }
.satz b { font-weight: 600; }
.satz .zz { color: var(--mauve); font-weight: 500; }

/* Leiste mit Datum und Jetzt */
.leiste { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 14px 0 12px; }
.feld { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 7px 10px; min-height: 40px; }
input[type="date"].feld { min-width: 150px; }
.live-punkt { width: 9px; height: 9px; border-radius: 50%; background: var(--soft); flex: none; }
.knopf[aria-pressed="true"] .live-punkt { background: var(--green); animation: puls 2s ease-in-out infinite; }
@keyframes puls { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .knopf[aria-pressed="true"] .live-punkt { animation: none; } }
.leiste .rechts { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

/* Brett mit Karten */
.brett { display: grid; gap: 10px; }
.karte {
  display: grid; grid-template-columns: minmax(0, 250px) minmax(0, 1fr); gap: 6px 18px; align-items: center;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px;
}
.karte.ref { border-color: var(--line-2); }
.info { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 8px; align-items: start; min-width: 0; }
.ort { font-weight: 600; color: var(--head); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.unter { font-size: 13px; color: var(--soft); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; grid-column: 1 / -1; }
.unter .kz { color: var(--mauve); font-weight: 600; }
.unter .diff { color: var(--blue); }
.werkzeug { display: flex; gap: 2px; }
.mini { background: none; border: 1px solid transparent; border-radius: 8px; color: var(--soft); cursor: pointer; width: 30px; height: 30px; display: grid; place-items: center; padding: 0; }
.mini:hover { color: var(--head); border-color: var(--line); background: var(--panel-2); }
.mini svg { width: 16px; height: 16px; }
.uhr { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 2px; margin-top: 2px; }
.ort .du { margin-left: 8px; font-size: 11px; font-weight: 600; color: var(--green); border: 1px solid color-mix(in srgb, var(--green) 45%, transparent); border-radius: 999px; padding: 1px 7px; vertical-align: 2px; }
.knopf.zurueck { border-color: var(--mauve); color: var(--mauve); }
.zeit {
  width: 5.6ch; font-size: 34px; font-weight: 300; line-height: 1.1; color: var(--head); letter-spacing: .01em;
  background: transparent; border: 1px solid transparent; border-radius: 8px; padding: 0 4px; margin-left: -5px;
}
.zeit.h12 { width: 7.4ch; }
.zeit:hover { border-color: var(--line); }
.zeit:focus { border-color: var(--mauve); background: var(--panel-2); outline: none; }
.sek { font-size: 15px; color: var(--soft); width: 2.4ch; }
.datum { font-size: 14px; color: var(--text); margin-left: auto; white-space: nowrap; }
.datum.anders { color: var(--warn); }

/* Zeitleiste */
.leiste-z { position: relative; min-width: 0; }
.stunden { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); height: 44px; border-radius: 10px; overflow: hidden; cursor: pointer; touch-action: pan-y; user-select: none; }
.std { position: relative; display: grid; place-items: center; font-size: 12px; line-height: 1; border-right: 1px solid color-mix(in srgb, var(--bg) 35%, transparent); }
.std:last-child { border-right: 0; }
.std.n { background: var(--night); color: var(--night-t); }
.std.d { background: var(--dawn); color: var(--dawn-t); }
.std.t { background: var(--day); color: var(--day-t); }
.std.w { background: var(--work); color: var(--work-t); box-shadow: inset 0 -3px 0 var(--work-mark); }
.std.neu::before { content: attr(data-tag); position: absolute; top: 3px; left: 4px; font-size: 8.5px; font-weight: 700; letter-spacing: .03em; line-height: 1; color: var(--mauve); white-space: nowrap; }
.std.neu.ende::before { left: auto; right: 3px; }
.std.neu { box-shadow: inset 2px 0 0 var(--mauve); }
.std.neu span { padding-top: 12px; }
.std.w.neu { box-shadow: inset 2px 0 0 var(--mauve), inset 0 -3px 0 var(--work-mark); }
.std small { font-size: 8px; vertical-align: super; margin-left: 1px; }
.zeiger { position: absolute; top: -4px; bottom: -4px; width: 2px; margin-left: -1px; background: var(--cursor); border-radius: 2px; pointer-events: none; box-shadow: 0 0 0 2px color-mix(in srgb, var(--bg) 60%, transparent); }

.regler-zeile { display: grid; grid-template-columns: minmax(0, 250px) minmax(0, 1fr); gap: 18px; padding: 4px 15px 0; align-items: center; }
.regler-zeile .hinweis { font-size: 13px; color: var(--soft); }
input[type="range"] { width: 100%; accent-color: var(--mauve); height: 28px; margin: 0; background: transparent; }

/* Suchfeld */
.suche { position: relative; margin-top: 14px; }
.suche input { width: 100%; padding: 12px 14px 12px 42px; font-size: 16px; background: var(--panel); border: 1px dashed var(--line-2); border-radius: var(--r); }
.suche input:focus { border-style: solid; border-color: var(--mauve); outline: none; }
.suche > svg { position: absolute; left: 14px; top: 14px; width: 18px; height: 18px; color: var(--soft); pointer-events: none; }
.vorschlaege { position: absolute; z-index: 5; left: 0; right: 0; top: calc(100% + 4px); margin: 0; padding: 4px; list-style: none; background: var(--panel-2); border: 1px solid var(--line-2); border-radius: 12px; box-shadow: 0 12px 30px rgba(0,0,0,.35); max-height: 320px; overflow: auto; }
.vorschlaege li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer; }
.vorschlaege li[aria-selected="true"], .vorschlaege li:hover { background: var(--mauve-bg); }
.vorschlaege .n1 { color: var(--head); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.vorschlaege .n2 { font-size: 13px; color: var(--soft); }
.vorschlaege .z { text-align: right; color: var(--text); }

.meldung { min-height: 1.5em; margin: 8px 2px 0; font-size: 14px; color: var(--warn); }
.meldung button { margin-left: 8px; }

/* Aktionen */
.aktionen { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; align-items: center; }
.merken { display: inline-flex; align-items: center; gap: 8px; margin-left: auto; font-size: 14px; color: var(--soft); cursor: pointer; min-height: 40px; }
.merken input { width: 18px; height: 18px; accent-color: var(--mauve); margin: 0; }
@media (max-width: 760px) { .merken { margin-left: 0; } }

/* Tafeln unten */
.tafeln { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 26px; }
.tafel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; min-width: 0; }
.tafel h2 { margin: 0 0 10px; font-size: 16px; color: var(--head); display: flex; align-items: center; gap: 8px; }
.tafel h2 svg { width: 18px; height: 18px; color: var(--mauve); }
.tafel p { margin: 6px 0; }
.umst { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.umst li { border-left: 3px solid var(--blue); padding: 2px 0 2px 10px; }
.umst li.keine { border-left-color: var(--line-2); color: var(--soft); }
.umst .wann { color: var(--head); }
.umst .klein { font-size: 13px; color: var(--soft); }
.achtung { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--warn-bg); color: var(--warn); font-size: 14px; border: 1px solid color-mix(in srgb, var(--warn) 40%, transparent); }
.achtung + .achtung { margin-top: 8px; }
.fakten { margin: 0; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; font-size: 15px; }
.fakten dt { color: var(--soft); }
.fakten dd { margin: 0; color: var(--text); }

details.spick { margin-top: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); }
details.spick summary { cursor: pointer; padding: 14px 18px; color: var(--head); font-weight: 600; list-style-position: inside; }
.tabelle-huelle { overflow-x: auto; padding: 0 12px 14px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 6px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--soft); font-weight: 600; position: sticky; top: 0; background: var(--panel); }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--panel-2); }
tbody tr.akt { background: var(--mauve-bg); color: var(--head); }
td .tag { font-size: 11px; color: var(--warn); margin-left: 4px; }

footer { margin-top: 30px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 14px; color: var(--soft); display: flex; flex-wrap: wrap; gap: 6px 16px; }
footer .gut { color: var(--green); }

.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(20px); opacity: 0; background: var(--panel-2); color: var(--head); border: 1px solid var(--line-2); border-radius: 12px; padding: 10px 16px; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 20; max-width: calc(100% - 32px); }
.toast.an { opacity: 1; transform: translateX(-50%); }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

@media (max-width: 760px) {
  .karte { grid-template-columns: minmax(0, 1fr); }
  /* Am Telefon bleibt der Regler unten am Rand stehen, auch wenn viele Orte darüber liegen. */
  .regler-zeile { grid-template-columns: minmax(0, 1fr); gap: 2px; position: sticky; bottom: 0; z-index: 4; margin: 0 -16px; padding: 8px 31px calc(8px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--bg) 92%, transparent); border-top: 1px solid var(--line); backdrop-filter: blur(6px); }
  .regler-zeile .hinweis { order: 2; }
  .tafeln { grid-template-columns: minmax(0, 1fr); }
  .stunden { height: 40px; }
  .std { font-size: 10px; }
  .std.ungerade span { visibility: hidden; }
  .leiste .rechts { margin-left: 0; }
  .zeit { font-size: 30px; }
}
@media (max-width: 420px) {
  header.kopf .steuer { width: 100%; }
  header.kopf .steuer select { flex: 1 1 0; min-width: 0; }
  #installieren { width: 100%; justify-content: center; }
}
</style>
</head>
<body>
<div class="huelle">
  <header class="kopf">

  const n = vorschlagListe.length;
  if (e.key === 'ArrowDown' && n) { e.preventDefault(); vorschlagIdx = (vorschlagIdx + 1) % n; markiereVorschlag(); }
  else if (e.key === 'ArrowUp' && n) { e.preventDefault(); vorschlagIdx = (vorschlagIdx - 1 + n) % n; markiereVorschlag(); }
  else if (e.key === 'Enter') { e.preventDefault(); waehle(vorschlagIdx); }

});

/* ===================== Start ===================== */
(function start() {
  let l = laden('hourbridge.lang');
  if (!T[l]) { const c = (navigator.languages || [navigator.language || 'de']).map(x => String(x).toLowerCase().split('-')[0]); l = c.find(x => T[x]) || 'en'; }
  const h = laden('hourbridge.h12');
  if (h === '1' || h === '0') S.h12 = h === '1';
  else { try { const hc = new Intl.DateTimeFormat(navigator.language, { hour: 'numeric' }).resolvedOptions(); S.h12 = hc.hour12 === true || hc.hourCycle === 'h12' || hc.hourCycle === 'h11'; } catch (e) {} }
  $('format').setAttribute('aria-pressed', String(S.h12));
  S.merken = laden('hourbridge.merken') === '1';
  $('merken').checked = S.merken;
  if (!hashLesen() && S.merken) {
    const z = (laden('hourbridge.zonen') || '').split(',').filter(x => x && gueltig(x));
    if (z.length) S.zonen = z;
  }
  setzeDarstellung(laden('werkstatt.darstellung') || 'system', false);
  setzeSprache(l, false);
  zeigeInstall();
  // Jede Sekunde nur im Live-Betrieb, und nur solange die Seite sichtbar ist.
  setInterval(() => { if (S.live && !document.hidden) aktualisiere(); }, 1000);
  setInterval(() => { if (!document.hidden) baueUmstellungen(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && S.live) aktualisiere(); });
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('./sw.js').catch(() => {});
})();
